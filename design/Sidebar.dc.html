<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dash","rooms","other","exp","rcpt","rep","set","cust","rtype"],"default":"dash"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'dash';
    const keys = ['dash','rooms','other','exp','rcpt','rep','set','cust','rtype'];
    const n = {};
    keys.forEach((k) => {
      const on = k === a;
      n[k] = on
        ? { bg: '#1b3d45', fg: '#ffffff', bar: '#4fd1bf', ic: '#4fd1bf', w: '600' }
        : { bg: 'transparent', fg: '#b9cad1', bar: 'transparent', ic: '#b9cad1', w: '400' };
    });
    return { n };
  }
}
