<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const TONE={success:['#e5f5ea','#157a3a'],warning:['#fdf1dc','#9a5806'],danger:['#fce9e9','#c02626'],info:['#e8effc','#2257c9'],primary:['#e3f3f1','#0d7068'],neutral:['#eef2f4','#55626c']};
const T=(t,x)=>({t:x,bg:TONE[t][0],fg:TONE[t][1]});
const num=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const int=n=>Number(n).toLocaleString('en-US');
const baht=n=>'฿'+num(n);
    const ST = { paid: ['success', 'ชำระแล้ว'], dep: ['info', 'มัดจำ'], due: ['warning', 'ค้างชำระ'] };
    const rows = [
      ['BK-202609-0064', 'คุณกิตติ พรหมมา', '080-009-1122', 'DLX 201', '24–27/09 · 3 คืน', 5400, 'dep'],
      ['BK-202609-0063', 'บริษัท ไทยทัวร์ จำกัด', '02-345-6789', 'FAM 301', '24–26/09 · 2 คืน', 5200, 'due'],
      ['BK-202609-0062', 'Mr. James Carter', '061-220-4478', 'STE 401', '24–26/09 · 2 คืน', 7800, 'dep'],
      ['BK-202609-0061', 'คุณวรรณา ศรีสุข', '089-765-4321', 'DLX 204', '24–26/09 · 2 คืน', 3600, 'paid']
    ].map((r) => ({ no: r[0], guest: r[1], phone: r[2], room: r[3], dates: r[4], amt: baht(r[5]), st: T(ST[r[6]][0], ST[r[6]][1]) }));
    return { rows };
  }
}
</script>
