<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Topbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 1192px; height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #e1e7ea; color: #14212b; font-family: 'Noto Sans Thai', 'Noto Sans', system-ui, sans-serif">
<button type="button" aria-label="ย่อ/ขยายเมนู" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #55626c; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 12px; line-height: 18px; color: #55626c">{{crumb}}</span>
<span style="font-size: 18px; line-height: 26px; font-weight: 600">{{heading}}</span>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 9999px; background: #e8effc; color: #2257c9; font-size: 12px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m10 8.5 5.5 3.5-5.5 3.5Z"></path></svg>Demo Mode</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #55626c"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect><path d="M3 9.5h18"></path><path d="M8 2.5v4"></path><path d="M16 2.5v4"></path></svg>24/09/2026</span>
<button type="button" aria-label="สลับธีมมืด" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #55626c; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"></path></svg></button>
<button type="button" aria-label="การแจ้งเตือน 3 รายการ" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #55626c; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 9999px; background: #c02626; border: 2px solid #ffffff"></span></button>
<div style="width: 36px; height: 36px; border-radius: 9999px; background: #e3f3f1; color: #0d7068; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">สม</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heading":{"editor":null,"default":"Dashboard"},"crumb":{"editor":null,"default":"หน้าหลัก"},"$preview":{"width":1192,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    return { heading: this.props.heading ?? 'Dashboard', crumb: this.props.crumb ?? 'หน้าหลัก' };
  }
}
</script>
</body>
</html>
